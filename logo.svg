<?xml version="1.0" encoding="UTF-8"?>
<!--
  SNAP·CUT Logo — Primary (light background)

  Mark narrative:
  ① Plastic cylinder feeds in from the top
  ② A blade enters from the right — angled tip, not yet through
  ③ The cut piece has already dropped and formed a sphere (pellet/granule)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" width="520" height="160">
<defs>

  <!-- ── Cylinder: vertical rod of plastic material ──────────── -->
  <!-- Linear gradient left→right simulates cylindrical shading  -->
  <linearGradient id="cyl" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%"   stop-color="#07111C"/>
    <stop offset="22%"  stop-color="#142840"/>
    <stop offset="50%"  stop-color="#1E4060"/>  <!-- central highlight -->
    <stop offset="78%"  stop-color="#142840"/>
    <stop offset="100%" stop-color="#07111C"/>
  </linearGradient>
  <!-- Top cap of cylinder (ellipse seen from slight angle) -->
  <radialGradient id="cyl-cap" cx="38%" cy="35%" r="65%">
    <stop offset="0%"   stop-color="#264E70"/>
    <stop offset="100%" stop-color="#0C2030"/>
  </radialGradient>

  <!-- ── Blade: stainless steel metallic gradient ─────────────  -->
  <linearGradient id="blade" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%"   stop-color="#5A6B7A"/>
    <stop offset="28%"  stop-color="#A8C0D0"/>
    <stop offset="52%"  stop-color="#D4E8F4"/>  <!-- bright cutting edge -->
    <stop offset="75%"  stop-color="#8AAABB"/>
    <stop offset="100%" stop-color="#4A5C6A"/>
  </linearGradient>
  <!-- Darker gradient toward the tip (blade thins out) -->
  <linearGradient id="blade-tip" x1="100%" y1="0%" x2="0%" y2="0%">
    <stop offset="0%"   stop-color="transparent"/>
    <stop offset="100%" stop-color="rgba(0,0,0,0.25)"/>
  </linearGradient>

  <!-- ── Sphere: cut pellet / granule ─────────────────────────  -->
  <radialGradient id="sph" cx="33%" cy="27%" r="70%">
    <stop offset="0%"   stop-color="#2E5678"/>
    <stop offset="40%"  stop-color="#15304C"/>
    <stop offset="100%" stop-color="#071320"/>
  </radialGradient>

  <!-- ── Badge clip ───────────────────────────────────────────  -->
  <clipPath id="badge">
    <circle cx="76" cy="80" r="56"/>
  </clipPath>

  <!-- Glow for blade tip contact point -->
  <filter id="tip-glow" x="-150%" y="-150%" width="400%" height="400%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

</defs>

<!-- ══════════════════════════════════════════════════════
     ICON MARK
     Badge:    center (76,80)  r=56
     Cylinder: x 63–89 (26 px wide)   y 20–78
     Cut:      y ≈ 77
     Blade:    spine at y=72, tip at (70, 76.5) — 73 % through cylinder
     Sphere:   center (76,114)  r=18
════════════════════════════════════════════════════════ -->

<!-- Badge drop shadow -->
<circle cx="76" cy="84" r="56" fill="rgba(0,0,0,0.22)"/>
<!-- Badge fill -->
<circle cx="76" cy="80" r="56" fill="#080E1A"/>

<g clip-path="url(#badge)">

  <!-- ①  CYLINDER body (plastic rod coming from above) -->
  <rect x="63" y="20" width="26" height="58" fill="url(#cyl)"/>

  <!-- Thin dark edge lines on cylinder sides for crisp 3D read -->
  <line x1="63" y1="20" x2="63" y2="78" stroke="#050D18" stroke-width="1.5"/>
  <line x1="89" y1="20" x2="89" y2="78" stroke="#050D18" stroke-width="1.5"/>

  <!-- Top elliptical cap — confirms it's a 3D tube -->
  <ellipse cx="76" cy="24" rx="13" ry="4.5" fill="url(#cyl-cap)"/>
  <ellipse cx="76" cy="24" rx="13" ry="4.5" fill="none" stroke="#0C1E30" stroke-width="0.8"/>

  <!-- ②  BLADE
       Shape: flat spine across the top, sharp bevel to tip at left.
       Blade enters from right; tip has reached x=70 (73 % through cylinder).

       Polygon vertices (clockwise):
         A  (134, 72)  — top-right, spine entry
         B  ( 74, 72)  — top, where spine meets bevel
         C  ( 70, 76)  — TIP — sharp point of blade
         D  ( 78, 81)  — bottom, where cutting-edge meets body
         E  (134, 81)  — bottom-right, body base
  -->
  <polygon points="134,72  74,72  70,76  78,81  134,81"
           fill="url(#blade)"/>

  <!-- Overlay to darken blade near tip (it thins = less material = darker) -->
  <polygon points="134,72  74,72  70,76  78,81  134,81"
           fill="url(#blade-tip)" opacity="0.35"/>

  <!-- Spine edge: crisp top line of blade -->
  <line x1="134" y1="72" x2="74" y2="72" stroke="#D0E4F0" stroke-width="0.7" opacity="0.6"/>
  <!-- Bevel facet highlight (tiny bright edge on the grind) -->
  <line x1="74" y1="72" x2="70" y2="76"  stroke="#E8F4FF" stroke-width="0.9" opacity="0.7"/>
  <line x1="70" y1="76" x2="78" y2="81"  stroke="#B0C8D8" stroke-width="0.6" opacity="0.5"/>

  <!-- Right face of blade (entering side — show it's thick) -->
  <rect x="131" y="72" width="3" height="9" rx="1" fill="#3A4A58"/>

  <!-- Blade tip contact glow: cyan micro-spark where blade meets plastic -->
  <circle cx="70" cy="76" r="4.5" fill="#00C0F0" opacity="0.35" filter="url(#tip-glow)"/>
  <circle cx="70" cy="76" r="1.6" fill="#00DCFF" opacity="0.95"/>

  <!-- Cut gap in cylinder: thin bright seam where blade has already passed -->
  <!-- (right of tip → right edge of cylinder) -->
  <line x1="70" y1="76" x2="89" y2="76"
        stroke="#00CCEE" stroke-width="0.9" opacity="0.55"/>

  <!-- ③  SPHERE — the cut pellet that has dropped below -->
  <circle cx="76" cy="114" r="18" fill="url(#sph)"/>

  <!-- Specular highlight on sphere -->
  <ellipse cx="69" cy="107" rx="6" ry="4" fill="white" opacity="0.10"/>

  <!-- Faint drop shadow under sphere -->
  <ellipse cx="76" cy="133" rx="13" ry="2.5" fill="rgba(0,0,0,0.35)"/>

</g>

<!-- Badge ring -->
<circle cx="76" cy="80" r="56" fill="none" stroke="#18304C" stroke-width="1.5"/>


<!-- ══════════════════════════════════════════════════════
     WORDMARK
     Measured widths @ 56 px Arial Black:
       SNAP 171 px   · 19 px   CUT 131 px
     Start x = 152  →  end x ≈ 481
════════════════════════════════════════════════════════ -->

<text x="152" y="94"
      font-family="'Arial Black','Helvetica Neue',Arial,sans-serif"
      font-size="56" font-weight="900"
      fill="#0D1826" letter-spacing="-1">SNAP</text>

<text x="327" y="94"
      font-family="'Arial Black','Helvetica Neue',Arial,sans-serif"
      font-size="56" font-weight="900"
      fill="#006FA0">·</text>

<text x="350" y="94"
      font-family="'Arial Black','Helvetica Neue',Arial,sans-serif"
      font-size="56" font-weight="900"
      fill="#0D1826" letter-spacing="-1">CUT</text>

<!-- Rule -->
<line x1="152" y1="104" x2="481" y2="104" stroke="#B0BCC8" stroke-width="0.75"/>

<!-- Tagline -->
<text x="152" y="123"
      font-family="'Helvetica Neue',Arial,sans-serif"
      font-size="11.5" font-weight="400"
      fill="#5A7090" letter-spacing="3.8">SMART CUT. CLEAN DROP.</text>

</svg>
