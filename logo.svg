<?xml version="1.0" encoding="UTF-8"?>
<!--
  SNAP·CUT Logo
  Concept: two plastic strips diagonally cut and snapped apart — the core action of the machine.
  The cyan blade line echoes the HMI palette. The dot separator is brand-consistent with the HMI header.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" width="520" height="160">
  <defs>

    <!-- Clip bars to the circular badge -->
    <clipPath id="badge-clip">
      <circle cx="76" cy="80" r="58"/>
    </clipPath>

    <!-- Cut line: (91,22) → (62,138) — slight diagonal, mimicking a real blade angle -->
    <clipPath id="cut-left">
      <polygon points="0,0  91,22  62,138  0,138"/>
    </clipPath>
    <clipPath id="cut-right">
      <polygon points="91,22  160,0  160,160  62,138"/>
    </clipPath>

    <!-- Cyan glow on the blade line -->
    <filter id="cyan-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- Transparent background — works on any surface -->

  <!-- ══════════════════════════════════════
       ICON MARK
  ══════════════════════════════════════ -->

  <!-- Drop shadow -->
  <circle cx="76" cy="83" r="57" fill="rgba(0,0,0,0.16)"/>
  <!-- Badge fill -->
  <circle cx="76" cy="80" r="57" fill="#0D1826"/>

  <!-- LEFT halves — slightly shifted left after the cut -->
  <g clip-path="url(#badge-clip)">
    <g clip-path="url(#cut-left)" transform="translate(-4,0)">
      <rect x="18" y="44" width="116" height="26" rx="5" fill="#1C3652"/>
      <rect x="18" y="44" width="116" height="7"  rx="5" fill="#284C72" opacity="0.9"/>
      <rect x="18" y="88" width="116" height="26" rx="5" fill="#1C3652"/>
      <rect x="18" y="88" width="116" height="7"  rx="5" fill="#284C72" opacity="0.9"/>
    </g>
  </g>

  <!-- RIGHT halves — slightly shifted right, marginally darker -->
  <g clip-path="url(#badge-clip)">
    <g clip-path="url(#cut-right)" transform="translate(4,0)">
      <rect x="18" y="44" width="116" height="26" rx="5" fill="#152B44"/>
      <rect x="18" y="44" width="116" height="7"  rx="5" fill="#1F3D5C" opacity="0.8"/>
      <rect x="18" y="88" width="116" height="26" rx="5" fill="#152B44"/>
      <rect x="18" y="88" width="116" height="7"  rx="5" fill="#1F3D5C" opacity="0.8"/>
    </g>
  </g>

  <!-- Blade — outer glow -->
  <line x1="91" y1="22" x2="62" y2="138"
        stroke="#00C8F0" stroke-width="10" stroke-linecap="round"
        opacity="0.20" filter="url(#cyan-glow)"
        clip-path="url(#badge-clip)"/>
  <!-- Blade — sharp core -->
  <line x1="91" y1="22" x2="62" y2="138"
        stroke="#00DCFF" stroke-width="2.6" stroke-linecap="round"
        clip-path="url(#badge-clip)"/>

  <!-- Badge ring -->
  <circle cx="76" cy="80" r="57"
          fill="none" stroke="#1C3652" stroke-width="1.5"/>

  <!-- ══════════════════════════════════════
       WORDMARK
       Measured widths @ 56px Arial Black:
         SNAP = 171 px
         ·    =  19 px
         CUT  = 131 px
       Start x = 152  →  end x ≈ 481
  ══════════════════════════════════════ -->

  <!-- SNAP -->
  <text x="152" y="97"
        font-family="'Arial Black','Helvetica Neue',Arial,sans-serif"
        font-size="56" font-weight="900"
        fill="#0D1826" letter-spacing="-1">SNAP</text>

  <!-- · dot — cyan, brand separator -->
  <text x="327" y="97"
        font-family="'Arial Black','Helvetica Neue',Arial,sans-serif"
        font-size="56" font-weight="900"
        fill="#007AB0">·</text>

  <!-- CUT -->
  <text x="350" y="97"
        font-family="'Arial Black','Helvetica Neue',Arial,sans-serif"
        font-size="56" font-weight="900"
        fill="#0D1826" letter-spacing="-1">CUT</text>

  <!-- Hairline rule -->
  <line x1="152" y1="107" x2="481" y2="107"
        stroke="#B0BCC8" stroke-width="0.75"/>

  <!-- Tagline (measured: ~198 px wide — left-aligned with wordmark) -->
  <text x="152" y="126"
        font-family="'Helvetica Neue',Arial,sans-serif"
        font-size="11.5" font-weight="400"
        fill="#5A7090" letter-spacing="4">PRECISION CUTTING SYSTEMS</text>

</svg>
