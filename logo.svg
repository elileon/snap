<?xml version="1.0" encoding="UTF-8"?>
<!--
  SNAP·CUT Logo — Primary (light background)
  Mark: a sphere of plastic material, cut horizontally by a blade.
  The bottom half drops — "clean drop". The cyan blade line glows at the cut plane.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" width="520" height="160">
<defs>

  <!-- Sphere gradient: light source top-left → dark bottom-right -->
  <radialGradient id="sg-a" cx="34%" cy="26%" r="72%">
    <stop offset="0%"   stop-color="#2E5678"/>
    <stop offset="42%"  stop-color="#16304C"/>
    <stop offset="100%" stop-color="#081420"/>
  </radialGradient>
  <!-- Bottom half: same gradient but slightly cooler/darker -->
  <radialGradient id="sg-b" cx="38%" cy="28%" r="72%">
    <stop offset="0%"   stop-color="#1E3E5A"/>
    <stop offset="100%" stop-color="#081420"/>
  </radialGradient>
  <!-- Cut face: flat disc visible at the cut plane -->
  <radialGradient id="sg-face" cx="40%" cy="40%" r="60%">
    <stop offset="0%"   stop-color="#1F3D5E"/>
    <stop offset="100%" stop-color="#0C1F32"/>
  </radialGradient>

  <!-- Clip: top half of sphere — above the cut (y ≤ 78) -->
  <clipPath id="c-top">
    <rect x="18" y="18" width="116" height="60"/>
  </clipPath>
  <!-- Clip: bottom half — below the cut (y ≥ 78) -->
  <clipPath id="c-bot">
    <rect x="18" y="78" width="116" height="74"/>
  </clipPath>
  <!-- Clip: everything to the badge circle -->
  <clipPath id="badge">
    <circle cx="76" cy="80" r="56"/>
  </clipPath>

  <!-- Cyan glow filter for the cut line -->
  <filter id="glow" x="-60%" y="-200%" width="220%" height="500%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="4.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

</defs>

<!-- ══════════════════════════════════════
     ICON MARK — sphere cut horizontally
     Sphere: center (76, 78), radius 44
     Cut plane: y = 78
     Bottom half: drops 11 px
════════════════════════════════════════ -->

<!-- Badge shadow -->
<circle cx="76" cy="83" r="56" fill="rgba(0,0,0,0.20)"/>
<!-- Badge fill -->
<circle cx="76" cy="80" r="56" fill="#090F1A"/>

<g clip-path="url(#badge)">

  <!-- TOP HALF of sphere -->
  <circle cx="76" cy="78" r="44" fill="url(#sg-a)" clip-path="url(#c-top)"/>
  <!-- Specular highlight — soft bright oval top-left -->
  <ellipse cx="61" cy="52" rx="13" ry="9"
           fill="white" opacity="0.07"/>

  <!-- Cut face of top piece (bottom of upper half) — concave disc -->
  <ellipse cx="76" cy="78" rx="44" ry="7.5"
           fill="url(#sg-face)"/>
  <!-- Inner ring on cut face: machined edge -->
  <ellipse cx="76" cy="78" rx="44" ry="7.5"
           fill="none" stroke="#0C2030" stroke-width="1"/>

  <!-- BOTTOM HALF of sphere — translated down 11 px after the cut -->
  <g transform="translate(0,11)">
    <!-- Sphere bottom body -->
    <circle cx="76" cy="78" r="44" fill="url(#sg-b)" clip-path="url(#c-bot)"/>
    <!-- Cut face of bottom piece (top of lower half) — freshly cut surface -->
    <ellipse cx="76" cy="78" rx="44" ry="7.5"
             fill="#162C44"/>
    <!-- Fresher, slightly lighter inner disc -->
    <ellipse cx="76" cy="78" rx="28" ry="4.5"
             fill="#1D3C58" opacity="0.8"/>
    <!-- Central glint — the cut is clean and shiny -->
    <ellipse cx="76" cy="77.5" rx="12" ry="1.8"
             fill="#3A6888" opacity="0.55"/>
  </g>

  <!-- ── BLADE LINE at cut plane ── -->
  <!-- Outer soft glow -->
  <line x1="18" y1="78" x2="134" y2="78"
        stroke="#00C8F0" stroke-width="10"
        stroke-linecap="round" opacity="0.22"
        filter="url(#glow)"/>
  <!-- Core line: the sharp edge of the blade -->
  <line x1="18" y1="78" x2="134" y2="78"
        stroke="#00E0FF" stroke-width="2.2"
        stroke-linecap="round"/>

  <!-- Blade tip: triangular point entering from right -->
  <polygon points="130,74.5 140,78 130,81.5"
           fill="#00E0FF" opacity="0.75"/>

</g>

<!-- Badge ring -->
<circle cx="76" cy="80" r="56"
        fill="none" stroke="#1A3050" stroke-width="1.5"/>


<!-- ══════════════════════════════════════
     WORDMARK
     Measured @ 56 px Arial Black:
       SNAP = 171 px  ·= 19 px  CUT = 131 px
     x start = 152 → end ≈ 481
════════════════════════════════════════ -->

<text x="152" y="94"
      font-family="'Arial Black','Helvetica Neue',Arial,sans-serif"
      font-size="56" font-weight="900"
      fill="#0D1826" letter-spacing="-1">SNAP</text>

<text x="327" y="94"
      font-family="'Arial Black','Helvetica Neue',Arial,sans-serif"
      font-size="56" font-weight="900"
      fill="#006FA0">·</text>

<text x="350" y="94"
      font-family="'Arial Black','Helvetica Neue',Arial,sans-serif"
      font-size="56" font-weight="900"
      fill="#0D1826" letter-spacing="-1">CUT</text>

<!-- Hairline rule -->
<line x1="152" y1="104" x2="481" y2="104"
      stroke="#B0BCC8" stroke-width="0.75"/>

<!-- Tagline: brand promise distilled -->
<text x="152" y="123"
      font-family="'Helvetica Neue',Arial,sans-serif"
      font-size="11.5" font-weight="400"
      fill="#5A7090" letter-spacing="3.8">SMART CUT. CLEAN DROP.</text>

</svg>
