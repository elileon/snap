<?xml version="1.0" encoding="UTF-8"?>
<!--
  SNAP·CUT Logo — Dark / Reversed variant
  Use on dark backgrounds. Wordmark in white, tagline in muted light.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" width="520" height="160">
  <defs>

    <clipPath id="badge-clip-d">
      <circle cx="76" cy="80" r="57"/>
    </clipPath>

    <clipPath id="cut-left-d">
      <polygon points="0,0  91,22  62,138  0,138"/>
    </clipPath>
    <clipPath id="cut-right-d">
      <polygon points="91,22  160,0  160,160  62,138"/>
    </clipPath>

    <filter id="cyan-glow-d" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- Transparent background -->

  <!-- ══ ICON MARK ══ -->
  <circle cx="76" cy="83" r="57" fill="rgba(0,0,0,0.25)"/>
  <circle cx="76" cy="80" r="57" fill="#0D1826"/>

  <g clip-path="url(#badge-clip-d)">
    <g clip-path="url(#cut-left-d)" transform="translate(-4,0)">
      <rect x="18" y="44" width="116" height="26" rx="5" fill="#1C3652"/>
      <rect x="18" y="44" width="116" height="7"  rx="5" fill="#284C72" opacity="0.9"/>
      <rect x="18" y="88" width="116" height="26" rx="5" fill="#1C3652"/>
      <rect x="18" y="88" width="116" height="7"  rx="5" fill="#284C72" opacity="0.9"/>
    </g>
  </g>

  <g clip-path="url(#badge-clip-d)">
    <g clip-path="url(#cut-right-d)" transform="translate(4,0)">
      <rect x="18" y="44" width="116" height="26" rx="5" fill="#152B44"/>
      <rect x="18" y="44" width="116" height="7"  rx="5" fill="#1F3D5C" opacity="0.8"/>
      <rect x="18" y="88" width="116" height="26" rx="5" fill="#152B44"/>
      <rect x="18" y="88" width="116" height="7"  rx="5" fill="#1F3D5C" opacity="0.8"/>
    </g>
  </g>

  <line x1="91" y1="22" x2="62" y2="138"
        stroke="#00C8F0" stroke-width="10" stroke-linecap="round"
        opacity="0.22" filter="url(#cyan-glow-d)"
        clip-path="url(#badge-clip-d)"/>
  <line x1="91" y1="22" x2="62" y2="138"
        stroke="#00DCFF" stroke-width="2.6" stroke-linecap="round"
        clip-path="url(#badge-clip-d)"/>

  <circle cx="76" cy="80" r="57"
          fill="none" stroke="#1C3652" stroke-width="1.5"/>

  <!-- ══ WORDMARK — white on dark ══ -->
  <text x="152" y="97"
        font-family="'Arial Black','Helvetica Neue',Arial,sans-serif"
        font-size="56" font-weight="900"
        fill="#E8F0F8" letter-spacing="-1">SNAP</text>

  <text x="327" y="97"
        font-family="'Arial Black','Helvetica Neue',Arial,sans-serif"
        font-size="56" font-weight="900"
        fill="#00AADD">·</text>

  <text x="350" y="97"
        font-family="'Arial Black','Helvetica Neue',Arial,sans-serif"
        font-size="56" font-weight="900"
        fill="#E8F0F8" letter-spacing="-1">CUT</text>

  <line x1="152" y1="107" x2="481" y2="107"
        stroke="#2A4060" stroke-width="0.75"/>

  <text x="152" y="126"
        font-family="'Helvetica Neue',Arial,sans-serif"
        font-size="11.5" font-weight="400"
        fill="#4A7090" letter-spacing="4">PRECISION CUTTING SYSTEMS</text>

</svg>
